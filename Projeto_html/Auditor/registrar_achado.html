<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Achado - ACodITools</title>
    <link rel="stylesheet" href="../Estilo/estiloconteud.css">
</head>
<body>
    <div class="content-section">
        <header class="section-header">
            <i class="fas fa-plus-circle fa-2x"></i>
            <h3>Registrar Achado</h3>
        </header>

        <section class="form-container">
            <h4><i class="fas fa-clipboard"></i> Novo Achado</h4>
            <p>Adicione detalhes sobre o achado identificado durante a auditoria.</p>
            <form class="form-achado">
                <div class="form-group">
                    <label for="titulo">Título do Achado:</label>
                    <input type="text" id="titulo" name="titulo" placeholder="Ex.: Falha no Controle de Acesso" required>
                </div>
                <div class="form-group">
                    <label for="auditoria">Auditoria Relacionada:</label>
                    <select id="auditoria" name="auditoria">
                        <option value="">Selecione uma auditoria</option>
                        <option value="01">01 - XYZ Ltda (01/04/2025)</option>
                        <option value="02">02 - ABC Corp (02/04/2025)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="descricao">Descrição:</label>
                    <textarea id="descricao" name="descricao" rows="6" placeholder="Descreva o achado em detalhes..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="categoria">Categoria:</label>
                    <select id="categoria" name="categoria">
                        <option value="">Selecione</option>
                        <option value="seguranca">Segurança</option>
                        <option value="processo">Processo</option>
                        <option value="conformidade">Conformidade</option>
                        <option value="financeiro">Financeiro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="evidencias">Anexar Evidências:</label>
                    <input type="file" id="evidencias" name="evidencias" multiple>
                    <p class="form-note">Suporta múltiplos arquivos (ex.: imagens, PDFs).</p>
                </div>
                <div class="botoes">
                    <button type="submit" class="btn-submeter"><i class="fas fa-save"></i> Salvar Achado</button>
                    <a href="inicio_dashboard.html" class="btn-cancelar"><i class="fas fa-times"></i> Cancelar</a>
                </div>
            </form>
        </section>
    </div>
</body>
</html>
